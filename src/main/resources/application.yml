spring:
  application:
    name: gym-crm
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

info:
  app:
    name: ${spring.application.name}
    description: Gym CRM REST API - trainee/trainer/training management

jwt:
  secret: ${JWT_SECRET:c3ByaW5nLXNlY3VyaXR5LWd5bS1jcm0tZGVtby1zZWNyZXQta2V5LTI1Ni1iaXRz}
  expiration-ms: 3600000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}