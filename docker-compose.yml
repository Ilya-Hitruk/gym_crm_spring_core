name: gym-crm

services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    environment:
      POSTGRES_DB: gym_crm_dev
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d gym_crm_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [gym-net]

  mongo:
    image: mongo:7
    container_name: gym-mongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [gym-net]

  activemq:
    image: apache/activemq-classic:6.1.2
    container_name: gym-activemq
    ports:
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/61616'"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [gym-net]

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    image: gym-crm/discovery-server
    container_name: gym-discovery
    ports:
      - "8761:8761"
    networks: [gym-net]

  trainer-workload-service:
    build:
      context: .
      dockerfile: trainer-workload-service/Dockerfile
    image: gym-crm/trainer-workload-service
    container_name: gym-workload
    environment:
      MONGODB_URI: mongodb://mongo:27017/trainer_workload_db
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      EUREKA_URI: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLWRlbW8tand0LXNlY3JldC1rZXktZm9yLWd5bS1jcm0tMjAyNg==}
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
      activemq:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks: [gym-net]

  gym-crm-service:
    build:
      context: .
      dockerfile: gym-crm-service/Dockerfile
    image: gym-crm/gym-crm-service
    container_name: gym-crm
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
      ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      EUREKA_URI: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLWRlbW8tand0LXNlY3JldC1rZXktZm9yLWd5bS1jcm0tMjAyNg==}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
      discovery-server:
        condition: service_started
    networks: [gym-net]

networks:
  gym-net:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
