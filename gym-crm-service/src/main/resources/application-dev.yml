spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/gym_crm_dev
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
